name: Build APK
on:<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل الحضور</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#16302b;--mute:#6b7c78;--line:#dfe5e3;
--p:#1f9d6b;--a:#d64545;--r:#e0a21b;--v:#5b6fd6;--sel:#16302b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1917;--card:#17252a;--ink:#e6f0ed;--mute:#8da39e;--line:#26373a;--p:#3ec28c;--a:#ee6a6a;--r:#f0b94a;--v:#8b9bf0;--sel:#e6f0ed}}
:root[data-theme="dark"]{--bg:#0f1917;--card:#17252a;--ink:#e6f0ed;--mute:#8da39e;--line:#26373a;--p:#3ec28c;--a:#ee6a6a;--r:#f0b94a;--v:#8b9bf0;--sel:#e6f0ed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;max-width:520px;margin-inline:auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.top h1{font-size:22px;font-weight:800;margin:0;text-align:center;flex:1}
.top h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute)}
.nav{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer;font-family:inherit}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;border-bottom:4px solid var(--c)}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1;color:var(--c)}
.stat span{font-size:12px;color:var(--mute)}
.bal{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.bal .row{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.bar{height:8px;background:var(--line);border-radius:6px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--v);width:0;transition:width .25s}
.bal input{width:56px;font:inherit;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:3px}
.cal{background:var(--card);border-radius:16px;padding:10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{text-align:center;font-size:12px;color:var(--mute);padding:4px 0}
.d{aspect-ratio:1;border-radius:11px;border:1.5px solid transparent;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.d em{font-style:normal;font-size:9px;font-weight:600;line-height:1}
.d.p{background:var(--p);color:#fff}.d.a{background:var(--a);color:#fff}
.d.r{background:var(--r);color:#2b2108}.d.v{background:var(--v);color:#fff}
.d.today{border-color:var(--sel);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--sel)}
.d.empty{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:12px;color:var(--mute);margin:12px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btn.main{background:var(--p);border-color:var(--p);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.panel{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 12px;font-size:17px;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:16px 8px;border-radius:14px;border:0;color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.opt.p{background:var(--p)}.opt.a{background:var(--a)}.opt.r{background:var(--r);color:#2b2108}.opt.v{background:var(--v)}
.clr{width:100%;margin-top:10px;padding:11px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--mute);font:inherit;cursor:pointer}
.stats{display:none}
#tbl{background:none!important;padding:0!important}
.tday{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px}
.tday label{font-size:12px;color:var(--mute)}
.tday input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:3px 6px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bx{height:150px;border:0;border-radius:22px;color:#fff;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;opacity:.82}
.bx span{font-size:24px;font-weight:800}
.bx b{font-size:38px;font-weight:800;line-height:1.1}
.bx small{font-size:12px;opacity:.9}
.bx.p{background:var(--p)}.bx.a{background:var(--a)}.bx.r{background:var(--r);color:#2b2108}.bx.v{background:var(--v)}
.bx.on{opacity:1;box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--sel)}
.stats{display:grid}.tabs,#tbl{display:none!important}
.acts{display:grid;grid-template-columns:1fr 1fr}.acts .btn{min-width:0}
.btn.p{background:var(--p);border-color:var(--p);color:#fff}.btn.a{background:var(--a);border-color:var(--a);color:#fff}
.btn.v{background:var(--v);border-color:var(--v);color:#fff}.btn.r{background:var(--r);border-color:var(--r);color:#2b2108}
.banner{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--r);color:#2b2108;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:700;font-size:14px}
.banner[hidden]{display:none}
.banner button{border:0;border-radius:10px;background:#2b2108;color:#fff;font:inherit;font-size:13px;padding:7px 12px;cursor:pointer}
.rem{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.rem input{font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:3px 6px}
.rem button{margin-inline-start:auto;border:1px solid var(--line);border-radius:10px;background:none;color:var(--ink);font:inherit;font-size:12px;padding:6px 10px;cursor:pointer}
.tabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:14px;margin-bottom:12px}
.tab{flex:1;padding:9px;border:0;border-radius:11px;background:none;color:var(--mute);font:inherit;font-weight:700;cursor:pointer}
.tab.on{background:var(--sel);color:var(--bg)}
#tbl{display:none;background:var(--card);border-radius:16px;padding:6px 8px}
.tb{width:100%;border-collapse:collapse}
.tb th{font-size:13px;padding:8px 2px;border-bottom:2px solid var(--line)}
.tb th.hp{color:var(--p)}.tb th.ha{color:var(--a)}.tb th.hr{color:var(--r)}.tb th.hv{color:var(--v)}
.tb td{text-align:center;padding:4px 2px;border-bottom:1px solid var(--line)}
.tb td.dn{text-align:right;font-weight:700;font-size:14px;white-space:nowrap}
.tb td.dn small{color:var(--mute);font-weight:400;font-size:11px;margin-inline-start:4px}
.tb tfoot td{font-weight:800;font-size:16px;border-bottom:0;padding:10px 2px}
.ck{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:none;color:#fff;font-size:17px;font-weight:800;cursor:pointer;padding:0}
.ck.p.on{background:var(--p);border-color:var(--p)}.ck.a.on{background:var(--a);border-color:var(--a)}
.ck.r.on{background:var(--r);border-color:var(--r);color:#2b2108}.ck.v.on{background:var(--v);border-color:var(--v)}
button:focus-visible,input:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
</style>
</head>
<body>
<div class="top">
  <button class="nav" id="next" aria-label="الشهر السابق">›</button>
  <h1 id="title"></h1>
  <button class="nav" id="prev" aria-label="الشهر التالي">‹</button>
</div>

<div class="banner" id="banner" hidden><span>لسه ما سجلتش حضورك النهارده ⏰</span><button id="bn">سجّل حضور</button></div>
<div class="rem"><span>تذكير الساعة</span><input type="time" id="rt" value="09:00"><button id="en">فعّل الإشعارات</button></div>
<div class="stats">
  <div class="stat" style="--c:var(--p)"><b id="sp">0</b><span>حضور</span></div>
  <div class="stat" style="--c:var(--a)"><b id="sa">0</b><span>غياب</span></div>
  <div class="stat" style="--c:var(--r)"><b id="sr">0</b><span>راحة</span></div>
  <div class="stat" style="--c:var(--v)"><b id="sv">0</b><span>سنوي</span></div>
</div>

<div class="bal">
  <div class="row"><span>رصيد السنوي لسنة <span id="yr"></span></span>
    <span>الرصيد: <input id="allow" type="number" min="0" max="99" inputmode="numeric"> يوم</span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="row"><span>المستخدم: <b id="used">0</b></span><span>المتبقي: <b id="left">0</b></span></div>
</div>

<div class="tabs"><button class="tab on" id="tabT">جدول التسجيل</button><button class="tab" id="tabC">التقويم</button></div>
<div class="cal" id="cal"><div class="grid" id="grid"></div></div>
<div id="tbl" style="display:block"></div>

<div class="legend">
  <span><i style="background:var(--p)"></i>حضور</span>
  <span><i style="background:var(--a)"></i>غياب</span>
  <span><i style="background:var(--r)"></i>راحة</span>
  <span><i style="background:var(--v)"></i>سنوي</span>
</div>

<div class="acts">
  <button class="btn p" id="todayP">سجّل حضور اليوم</button>
  <button class="btn a" id="todayA">سجّل غياب اليوم</button>
  <button class="btn v" id="todayV">سجّل سنوي اليوم</button>
  <button class="btn r" id="fri">الجمعة راحة في الشهر</button>
</div>

<div class="sheet" id="sheet">
  <div class="panel">
    <h2 id="sheetTitle"></h2>
    <div class="opts">
      <button class="opt p" data-s="p">حضور</button>
      <button class="opt a" data-s="a">غياب</button>
      <button class="opt r" data-s="r">راحة</button>
      <button class="opt v" data-s="v">سنوي</button>
    </div>
    <button class="clr" id="clr">مسح التسجيل</button>
  </div>
</div>

<script>
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const WD=['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
const LBL={p:'حضور',a:'غياب',r:'راحة',v:'سنوي'};
const KEY='attendance-v1';
let mem=null;
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return mem||{days:{},allow:21}}
let S=load();
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const now=new Date();let Y=now.getFullYear(),M=now.getMonth(),sel=null;
const $=id=>document.getElementById(id);
const k=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const dim=(y,m)=>new Date(y,m+1,0).getDate();

function render(){
  $('title').innerHTML=MONTHS[M]+' '+Y+'<small>سجل الحضور والإجازات</small>';
  const g=$('grid');g.innerHTML='';
  WD.forEach(w=>{const e=document.createElement('div');e.className='wd';e.textContent=w.slice(0,w==='الإثنين'?3:w.length>5?3:w.length);g.appendChild(e)});
  const off=(new Date(Y,M,1).getDay()+1)%7;
  for(let i=0;i<off;i++){const e=document.createElement('div');e.className='d empty';g.appendChild(e)}
  const c={p:0,a:0,r:0,v:0};
  for(let d=1;d<=dim(Y,M);d++){
    const key=k(Y,M,d),st=S.days[key];if(st)c[st]++;
    const b=document.createElement('button');
    b.className='d'+(st?' '+st:'')+(Y===now.getFullYear()&&M===now.getMonth()&&d===now.getDate()?' today':'');
    b.innerHTML=d+(st?'<em>'+LBL[st]+'</em>':'');
    b.onclick=()=>openSheet(d);g.appendChild(b);
  }
  $('sp').textContent=c.p;$('sa').textContent=c.a;$('sr').textContent=c.r;$('sv').textContent=c.v;
  let used=0;for(const x in S.days)if(S.days[x]==='v'&&x.startsWith(Y+'-'))used++;
  const al=+S.allow||0;
  $('yr').textContent=Y;$('allow').value=al;$('used').textContent=used;
  $('left').textContent=Math.max(al-used,0)+(used>al?' (تجاوزت '+(used-al)+')':'');
  $('bar').style.width=(al?Math.min(used/al,1)*100:0)+'%';
  renderTable(c);check();
}
let T=k(now.getFullYear(),now.getMonth(),now.getDate());
$('tabT').textContent='اليوم';
function renderTable(c){
  const st=S.days[T],p=T.split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]);
  const nm={p:'حضور',a:'غياب',r:'راحة',v:'سنوي'};
  let h='<div class="tday"><b>'+WD[(dt.getDay()+1)%7]+' '+dt.getDate()+' '+MONTHS[dt.getMonth()]+'</b><label>تاريخ آخر <input type="date" id="pd" value="'+T+'"></label></div><div class="big">';
  ['p','a','r','v'].forEach(s=>{h+='<button class="bx '+s+(st===s?' on':'')+'" data-s="'+s+'"><span>'+nm[s]+'</span><b>'+c[s]+'</b><small>'+(st===s?'✓ مسجّل':'هذا الشهر')+'</small></button>'});
  h+='</div>';
  $('tbl').innerHTML=h;
  $('pd').onchange=e=>{if(e.target.value){T=e.target.value;const q=T.split('-');Y=+q[0];M=+q[1]-1;render()}};
  $('tbl').querySelectorAll('.bx').forEach(b=>b.onclick=()=>{
    if(S.days[T]===b.dataset.s)delete S.days[T];else S.days[T]=b.dataset.s;
    save();render();
  });
}
function renderTableOld(c){
  let h='<table class="tb"><thead><tr><th>اليوم</th><th class="hp">حضور</th><th class="ha">غياب</th><th class="hr">راحة</th><th class="hv">سنوي</th></tr></thead><tbody>';
  for(let d=1;d<=dim(Y,M);d++){
    const st=S.days[k(Y,M,d)],wd=WD[(new Date(Y,M,d).getDay()+1)%7];
    h+='<tr><td class="dn">'+d+'<small>'+wd+'</small></td>';
    ['p','a','r','v'].forEach(s=>{h+='<td><button class="ck '+s+(st===s?' on':'')+'" data-d="'+d+'" data-s="'+s+'" aria-label="'+LBL[s]+'">'+(st===s?'✓':'')+'</button></td>'});
    h+='</tr>';
  }
  h+='</tbody><tfoot><tr><td class="dn">المجموع</td><td style="color:var(--p)">'+c.p+'</td><td style="color:var(--a)">'+c.a+'</td><td style="color:var(--r)">'+c.r+'</td><td style="color:var(--v)">'+c.v+'</td></tr></tfoot></table>';
  $('tbl').innerHTML=h;
  $('tbl').querySelectorAll('.ck').forEach(b=>b.onclick=()=>{
    const y=window.scrollY,key=k(Y,M,+b.dataset.d);
    if(S.days[key]===b.dataset.s)delete S.days[key];else S.days[key]=b.dataset.s;
    save();render();window.scrollTo(0,y);
  });
}
function tab(t){
  $('tbl').style.display=t?'block':'none';$('cal').style.display=t?'none':'block';
  $('tabT').classList.toggle('on',t);$('tabC').classList.toggle('on',!t);
}
$('tabT').onclick=()=>tab(true);$('tabC').onclick=()=>tab(false);
S.rt=S.rt||'09:00';$('rt').value=S.rt;
$('rt').onchange=e=>{S.rt=e.target.value||'09:00';save();check()};
$('en').onclick=()=>{try{Notification.requestPermission().then(p=>{$('en').textContent=p==='granted'?'الإشعارات مفعّلة ✓':'الإشعارات غير مسموحة'})}catch(e){$('en').textContent='المتصفح لا يدعمها'}};
$('bn').onclick=()=>{const n=new Date();S.days[k(n.getFullYear(),n.getMonth(),n.getDate())]='p';save();render()};
let notified='';
function check(){
  const n=new Date(),key=k(n.getFullYear(),n.getMonth(),n.getDate()),q=S.rt.split(':');
  const due=n.getHours()*60+n.getMinutes()>=(+q[0])*60+(+q[1]);
  const show=due&&!S.days[key];
  $('banner').hidden=!show;
  if(show&&notified!==key){notified=key;try{if(Notification.permission==='granted')new Notification('سجّل حضورك اليوم 🗓️')}catch(e){}}
}
setInterval(check,30000);document.addEventListener('visibilitychange',check);
function openSheet(d){
  sel=d;const dt=new Date(Y,M,d);
  $('sheetTitle').textContent=WD[(dt.getDay()+1)%7]+' '+d+' '+MONTHS[M];
  $('sheet').classList.add('on');
}
function closeSheet(){$('sheet').classList.remove('on')}
function setDay(s){
  const key=k(Y,M,sel);if(s)S.days[key]=s;else delete S.days[key];
  save();closeSheet();render();
}
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>setDay(b.dataset.s));
$('clr').onclick=()=>setDay(null);
$('sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};
$('prev').onclick=()=>{M++;if(M>11){M=0;Y++}render()};
$('next').onclick=()=>{M--;if(M<0){M=11;Y--}render()};
$('allow').onchange=e=>{S.allow=Math.max(0,+e.target.value||0);save();render()};
[['todayP','p'],['todayA','a'],['todayV','v']].forEach(([id,s])=>$(id).onclick=()=>{Y=now.getFullYear();M=now.getMonth();S.days[k(Y,M,now.getDate())]=s;save();render()});
$('fri').onclick=()=>{
  for(let d=1;d<=dim(Y,M);d++){const key=k(Y,M,d);if(new Date(Y,M,d).getDay()===5&&!S.days[key])S.days[key]='r'}
  save();render();
};
render();
</script>
<script type="module" src="./notification.js"></script>
</body>
</html>

  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap init "سجل الحضور" com.myapp.attendance --web-dir www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk attendance.apk
          gh release create "v${{ github.run_number }}" attendance.apk --title "النسخة ${{ github.run_number }}" --notes "ملف التطبيق"
